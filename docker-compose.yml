# OPCIONAL: só use se NÃO quiser usar o PostgreSQL que já está instalado no seu computador.
# Subir:   docker compose up -d
# Derrubar: docker compose down
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: troque_esta_senha
      POSTGRES_DB: raizes_v2
    ports:
      - "5432:5432"
    volumes:
      - raizes_pgdata:/var/lib/postgresql/data
volumes:
  raizes_pgdata:
